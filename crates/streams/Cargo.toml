[package]
name = "temporalio-streams"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Temporal Technologies Inc. <sdk@temporal.io>"]
license-file = { workspace = true }
description = "The Stream runtime of Temporal, and the trait that each Stream Store implements"
homepage = "https://temporal.io/"
repository = "https://github.com/temporalio/sdk-rust"
keywords = ["temporal", "workflow", "streams"]
categories = ["development-tools"]

[features]
# The Stream calls of Workflow code, which Core runs.
workflow = ["dep:parking_lot", "dep:rand", "dep:tokio", "dep:tracing"]

[dependencies]
async-trait = "0.1"
parking_lot = { version = "0.12", optional = true }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { version = "0.10", optional = true }
thiserror = { workspace = true }
tokio = { version = "1.47", default-features = false, features = [
  "rt",
  "sync",
  "time",
], optional = true }
tracing = { version = "0.1", optional = true }

[dependencies.temporalio-common]
path = "../common"
version = "~1.2.0"
default-features = false

[dev-dependencies]
parking_lot = "0.12"
tokio = { version = "1.47", features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
