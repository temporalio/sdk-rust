[package]
name = "temporalio-streams"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Temporal Technologies Inc. <sdk@temporal.io>"]
license-file = { workspace = true }
description = "The Stream runtime and shared definitions for Temporal Stream Store implementations"
homepage = "https://temporal.io/"
repository = "https://github.com/temporalio/sdk-rust"
keywords = ["temporal", "workflow", "streams"]
categories = ["development-tools"]

[features]
# The Stream calls of Workflow code, which Core uses.
workflow = [
  "dep:derive_more",
  "dep:futures-util",
  "dep:parking_lot",
  "dep:tokio",
  "dep:tokio-util",
  "dep:tracing",
]

[dependencies]
async-trait = "0.1"
derive_more = { workspace = true, optional = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
parking_lot = { version = "0.12", optional = true }
prost = { workspace = true }
prost-types = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { version = "1.47", default-features = false, features = [
  "macros",
  "rt",
  "sync",
  "time",
], optional = true }
tokio-util = { version = "0.7", optional = true }
tonic = { workspace = true }
tracing = { version = "0.1", optional = true }

[dependencies.temporalio-common]
path = "../common"
version = "~1.2.0"
default-features = false

[dev-dependencies]
parking_lot = "0.12"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
