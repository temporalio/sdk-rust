syntax = "proto3";

package coresdk.wasm_bridge;

import "temporal/api/workflowservice/v1/request_response.proto";

// Standalone-activity client calls supported by the Core WASM bridge.
message ClientRequest {
    oneof operation {
        temporal.api.workflowservice.v1.StartActivityExecutionRequest start_activity = 1;
        temporal.api.workflowservice.v1.PollActivityExecutionRequest poll_activity = 2;
        temporal.api.workflowservice.v1.RequestCancelActivityExecutionRequest cancel_activity = 3;
        temporal.api.workflowservice.v1.DescribeActivityExecutionRequest describe_activity = 4;
    }
}

message ClientResponse {
    int32 status_code = 1;
    string status_message = 2;
    bytes status_details = 3;
    oneof operation {
        temporal.api.workflowservice.v1.StartActivityExecutionResponse start_activity = 10;
        temporal.api.workflowservice.v1.PollActivityExecutionResponse poll_activity = 11;
        temporal.api.workflowservice.v1.RequestCancelActivityExecutionResponse cancel_activity = 12;
        temporal.api.workflowservice.v1.DescribeActivityExecutionResponse describe_activity = 13;
    }
}

// A unary gRPC request sent from Temporal Core to the Go host transport.
message GrpcRequest {
    uint64 id = 1;
    string service = 2;
    string rpc = 3;
    repeated MetadataEntry metadata = 4;
    bytes proto = 5;
}

// A unary gRPC response returned by the Go host transport to Temporal Core.
message GrpcResponse {
    int32 status_code = 1;
    string status_message = 2;
    repeated MetadataEntry headers = 3;
    repeated MetadataEntry trailers = 4;
    bytes status_details = 5;
    bytes proto = 6;
}

// One gRPC metadata value. Repeated entries preserve duplicate values and their
// order. Values use the decoded gRPC representation, including raw binary
// values for keys ending in "-bin".
message MetadataEntry {
    string key = 1;
    bytes value = 2;
}
