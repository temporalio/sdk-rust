syntax = "proto3";

package coresdk.external_data;
option ruby_package = "Temporalio::Internal::Bridge::Api::ExternalData";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "temporal/api/failure/v1/message.proto";
import "temporal/api/stream/v1/message.proto";
import "temporal/sdk/core/common/common.proto";

// This file defines data that Core might write externally. The first motivating case being
// storing data in markers in event history. Defining such data as protos provides an easy way
// for consumers which would like to just depend on the proto package to make sense of marker data.

message LocalActivityMarkerData {
  uint32 seq = 1;
  // The number of attempts at execution before we recorded this result. Typically starts at 1,
  // but it is possible to start at a higher number when backing off using a timer.
  uint32 attempt = 2;
  string activity_id = 3;
  string activity_type = 4;
  // You can think of this as "perceived completion time". It is the time the local activity thought
  // it was when it completed. Which could be different from wall-clock time because of workflow
  // replay. It's the WFT start time + the LA's runtime
  google.protobuf.Timestamp complete_time = 5;
  // If set, this local activity conceptually is retrying after the specified backoff.
  // Implementation wise, they are really two different LA machines, but with the same type & input.
  // The retry starts with an attempt number > 1.
  google.protobuf.Duration backoff = 6;
  // The time the LA was originally scheduled (wall clock time). This is used to track
  // schedule-to-close timeouts when timer-based backoffs are used
  google.protobuf.Timestamp original_schedule_time = 7;
  // Position, within the workflow task, of the activation this resolution was delivered in.
  // Replay must deliver resolutions in the same activations because workflow code can branch on
  // which handles are ready. Absent in markers written by Core versions that predate this field.
  optional uint64 activation_index = 8;
}

message PatchedMarkerData {
  // The patch id
  string id = 1;
  // Whether or not the patch is marked deprecated.
  bool deprecated = 2;
}

// The data of the marker `core_stream`, which Core records once for each workflow task in which
// the workflow got a Stream result. It is in the detail `data` as `binary/protobuf`, so that a
// marker with Records stays small.
message StreamMarkerData {
  repeated StreamReadEntry reads = 1;
  repeated StreamAppendEntry appends = 2;
  repeated StreamCloseEntry closes = 3;
  // Each Stream of the entries, once. An entry gives the index of its Stream here, so that a task
  // with many results on one Stream holds its ref once.
  repeated temporal.api.stream.v1.StreamRef streams = 4;
}

// What one read gave the workflow in one workflow task.
message StreamReadEntry {
  uint32 seq = 1;
  // The index of the read's Stream in `StreamMarkerData.streams`.
  uint32 stream_index = 2;
  // The `from_offset` of the read, so a replay can check that the read is the same.
  bytes from_offset = 3;
  // The offset before the first Record of this task. A replay reads after it.
  bytes after_offset = 4;
  // The offset of the last Record of this task. Empty when the task got no Record.
  bytes last_offset = 5;
  // The number of Records of this task.
  uint32 count = 6;
  // The digest of the Records of this task. Empty when `records` holds them.
  bytes digest = 7;
  // The Records of this task, only for a read with its Records in history.
  repeated temporal.api.stream.v1.StreamRecord records = 8;
  // The number of Records of each page, in order. A page ends where its count ends.
  repeated uint32 page_counts = 9;
  // The activation of each page in the task. The first is the index, and each later one is the
  // gap to the one before.
  repeated uint32 page_activations = 10;
  // Set when the read ended in this task.
  StreamReadEnded end = 11;
}

message StreamReadEnded {
  bytes last_offset = 1;
  coresdk.common.StreamReadStop stop = 2;
  bool done = 3;
  temporal.api.failure.v1.Failure failure = 4;
  // The activation in the task that got the end.
  uint32 activation = 5;
}

// The result of one append, in the workflow task whose activation got it.
message StreamAppendEntry {
  uint32 seq = 1;
  // The index of the append's Stream in `StreamMarkerData.streams`.
  uint32 stream_index = 2;
  bytes first_offset = 3;
  bytes last_offset = 4;
  temporal.api.failure.v1.Failure failure = 5;
  // The activation in the task that got the result.
  uint32 activation = 6;
}

// A close in one workflow task: its intent, in the task that asked for it, or its result, in the
// task whose activation got it.
message StreamCloseEntry {
  uint32 seq = 1;
  // The index of the closed Stream in `StreamMarkerData.streams`.
  uint32 stream_index = 2;
  // Set on the intent, the epoch that Core closes with after the server took the task.
  temporal.api.stream.v1.WorkflowTaskEpoch intent_epoch = 3;
  // True on the result. `failure` is unset when the Stream is closed.
  bool resolved = 4;
  temporal.api.failure.v1.Failure failure = 5;
  // The activation in the task that got the result.
  uint32 activation = 6;
}
