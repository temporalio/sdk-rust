syntax = "proto3";

package coresdk.external_data;
option ruby_package = "Temporalio::Internal::Bridge::Api::ExternalData";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "temporal/api/failure/v1/message.proto";
import "temporal/api/stream/v1/message.proto";

// This file defines data that Core might write externally. The first motivating case being
// storing data in markers in event history. Defining such data as protos provides an easy way
// for consumers which would like to just depend on the proto package to make sense of marker data.

message LocalActivityMarkerData {
  uint32 seq = 1;
  // The number of attempts at execution before we recorded this result. Typically starts at 1,
  // but it is possible to start at a higher number when backing off using a timer.
  uint32 attempt = 2;
  string activity_id = 3;
  string activity_type = 4;
  // You can think of this as "perceived completion time". It is the time the local activity thought
  // it was when it completed. Which could be different from wall-clock time because of workflow
  // replay. It's the WFT start time + the LA's runtime
  google.protobuf.Timestamp complete_time = 5;
  // If set, this local activity conceptually is retrying after the specified backoff.
  // Implementation wise, they are really two different LA machines, but with the same type & input.
  // The retry starts with an attempt number > 1.
  google.protobuf.Duration backoff = 6;
  // The time the LA was originally scheduled (wall clock time). This is used to track
  // schedule-to-close timeouts when timer-based backoffs are used
  google.protobuf.Timestamp original_schedule_time = 7;
  // Position, within the workflow task, of the activation this resolution was delivered in.
  // Replay must deliver resolutions in the same activations because workflow code can branch on
  // which handles are ready. Absent in markers written by Core versions that predate this field.
  optional uint64 activation_index = 8;
}

message PatchedMarkerData {
  // The patch id
  string id = 1;
  // Whether or not the patch is marked deprecated.
  bool deprecated = 2;
}

// The data of a `core_stream` marker, in its `data` detail as `binary/protobuf`. Core records one
// in each Workflow Task in which Workflow code got a Stream result or asked for a close. It also
// records one when a close finishes while Core holds the Workflow's last command, though no
// Workflow code gets the result of that close.
message StreamMarkerData {
  // Each Stream that the entries refer to, once. An entry refers to a Stream by its index here.
  repeated temporal.api.stream.v1.StreamRef streams = 1;
  repeated StreamCloseIntent close_intents = 2;
  repeated StreamAppendResult appends = 3;
  repeated StreamCloseResult closes = 4;
  repeated StreamReadEntry reads = 5;
}

message StreamCloseIntent {
  uint32 seq = 1;
  uint32 stream = 2;
}

message StreamAppendResult {
  uint32 seq = 1;
  uint32 stream = 2;
  // The index of the activation, within its Workflow Task, in which Workflow code got the result.
  uint64 activation = 3;
  oneof result {
    StreamAppendOffsets appended = 4;
    temporal.api.failure.v1.Failure failure = 5;
  }
}

message StreamAppendOffsets {
  bytes first_offset = 1;
  bytes last_offset = 2;
}

message StreamCloseResult {
  uint32 seq = 1;
  uint64 activation = 2;
  // Unset if the Stream is closed.
  temporal.api.failure.v1.Failure failure = 3;
}

// What one read gave Workflow code in this task.
message StreamReadEntry {
  uint32 seq = 1;
  uint32 stream = 2;
  // The offset of the Record before this task's first one, which is `from_offset` in the read's
  // first task.
  bytes after_offset = 3;
  // The number of Records in each page, and the activation that got the page. Both lists have the
  // same length.
  repeated uint32 page_records = 4;
  repeated uint64 page_activations = 5;
  // The first 16 bytes of the SHA-256 of this task's Records. It's empty when `records` is set.
  bytes digest = 6;
  // This task's Records, for a read with `records_in_history`.
  repeated temporal.api.stream.v1.StreamRecord records = 7;
  // Set in the task in which Workflow code got the end of the read.
  StreamReadEnded end = 8;
  // The bytes of the Records that the pages of this entry gave Workflow code in this task, each as
  // a page of a read encodes it, with the tag and the length of its field. That is the measure of
  // the `max_bytes` of a read. It's set when `digest` is, so a replay knows how much it reads.
  uint64 record_bytes = 9;
}

message StreamReadEnded {
  uint64 activation = 1;
  bool done = 2;
  temporal.api.failure.v1.Failure failure = 3;
}
