syntax = "proto3";

package coresdk.common;
option ruby_package = "Temporalio::Internal::Bridge::Api::Common";

import "google/protobuf/duration.proto";

// Identifying information about a particular workflow execution, including namespace
message NamespacedWorkflowExecution {
    // Namespace the workflow run is located in
    string namespace = 1;
    // Can never be empty
    string workflow_id = 2;
    // May be empty if the most recent run of the workflow with the given ID is being targeted
    string run_id = 3;
}

// Why a read of a Stream ended. A read that failed has no stop.
enum StreamReadStop {
    STREAM_READ_STOP_UNSPECIFIED = 0;
    // The Stream is closed, and the read gave its last Record.
    STREAM_READ_STOP_DONE = 1;
    // The read gave `max_records` Records.
    STREAM_READ_STOP_MAX_RECORDS = 2;
    // The next Record would pass `max_bytes`.
    STREAM_READ_STOP_MAX_BYTES = 3;
    // No Record came for `idle_timeout`.
    STREAM_READ_STOP_IDLE = 4;
    // `timeout` passed since the read started.
    STREAM_READ_STOP_TIMEOUT = 5;
}

// An indication of user's intent concerning what Build ID versioning approach should be used for
// a specific command
enum VersioningIntent {
    // Indicates that core should choose the most sensible default behavior for the type of
    // command, accounting for whether the command will be run on the same task queue as the current
    // worker.
    UNSPECIFIED = 0;
    // Indicates that the command should run on a worker with compatible version if possible. It may
    // not be possible if the target task queue does not also have knowledge of the current worker's
    // build ID.
    COMPATIBLE = 1;
    // Indicates that the command should run on the target task queue's current overall-default
    // build ID.
    DEFAULT = 2;
}

message WorkerDeploymentVersion {
    string deployment_name = 1;
    string build_id = 2;
}

// Metrics for a set of external payload storage operations (all uploads and downloads)
// performed while processing a task, so core can emit unified logging and metrics.
message ExternalStorageMetrics {
    // Number of payloads stored or retrieved externally.
    uint64 payload_count = 1;
    // Total size in bytes of the externally stored or retrieved payloads.
    uint64 total_size_bytes = 2;
    // Wall-clock time spent on the external storage operations.
    google.protobuf.Duration total_duration = 3;
    // Names of the drivers that participated in the operations.
    repeated string driver_names = 4;
}