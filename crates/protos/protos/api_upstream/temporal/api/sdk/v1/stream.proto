syntax = "proto3";

package temporal.api.sdk.v1;

option go_package = "go.temporal.io/api/sdk/v1;sdk";
option java_package = "io.temporal.api.sdk.v1";
option java_multiple_files = true;
option java_outer_classname = "StreamProto";
option ruby_package = "Temporalio::Api::Sdk::V1";
option csharp_namespace = "Temporalio.Api.Sdk.V1";

// The Stream messages of an SDK, which the Stream WIT refers to. The SDK or SDK Core picks the
// Store of a call by its `StreamRef`, and calls that Store with the request of the same name in
// `temporal.api.streamservice.v1`, which has only the Stream id.

import "google/protobuf/duration.proto";

import "temporal/api/enums/v1/stream.proto";
import "temporal/api/stream/v1/message.proto";

// Experimental. Might change in the future.
// A reference to one Stream, which code passes to other code as data. Callers treat the `id` as
// opaque. An id is never used for a second Stream while the Store remembers the first one, so a
// create for an expired Stream fails. A Store can forget an expired Stream after a time of its
// choice, and a create for its id succeeds after that. Every SDK encodes a ref in a Payload with
// this message, so a ref that one SDK writes decodes in another.
message StreamRef {
  string id = 1;
  // The name under which the client and Worker config registered the Store of this Stream. An
  // SDK uses it to send a call on this ref to the right Store. When it's empty, the SDK picks
  // the Store from its config. Only an SDK sets and reads this field. A Store and the server
  // never get it, because their requests have only the Stream id.
  string store = 2;
}

// Experimental. Might change in the future.
// The SDK form of `temporal.api.streamservice.v1.CreateStreamRequest`, with the ref of the Stream
// in place of its id. The other fields mean the same.
// (-- api-linter: core::0133=disabled
//     aip.dev/not-precedent: The request identifies a Stream by its ref. --)
message CreateStreamRequest {
  // Required. The Stream to create. Its `id` must not be empty.
  StreamRef stream_ref = 1;
  temporal.api.enums.v1.StreamIdConflictPolicy id_conflict_policy = 2;
}

// Experimental. Might change in the future.
// The Stream that the create made or found.
message CreateStreamResponse {
  // The ref of the Stream. The caller can pass it to other code as data. The SDK builds it from
  // the request and the Store that it picked.
  StreamRef ref = 1;
  // False when `USE_EXISTING` returned a Stream that already existed.
  bool created = 2;
}

// Experimental. Might change in the future.
// The SDK form of `temporal.api.streamservice.v1.AppendRecordsRequest`, with the ref of the Stream
// in place of its id. The other fields mean the same.
message AppendRecordsRequest {
  // Required.
  StreamRef ref = 1;
  temporal.api.stream.v1.Producer producer = 2;
  repeated temporal.api.stream.v1.AppendRecord records = 3;
}

// Experimental. Might change in the future.
// The SDK form of `temporal.api.streamservice.v1.ReadRecordsRequest`, with the ref of the Stream
// in place of its id. The other fields mean the same.
message ReadRecordsRequest {
  // Required.
  StreamRef ref = 1;
  // (-- api-linter: core::0140::prepositions=disabled
  //     aip.dev/not-precedent: "from" marks the start of a range of offsets. --)
  bytes from_offset = 2;
  int32 max_records = 3;
  int64 max_bytes = 4;
  google.protobuf.Duration wait = 5;
}

// Experimental. Might change in the future.
// The SDK form of `temporal.api.streamservice.v1.DescribeStreamRequest`, with the ref of the
// Stream in place of its id.
message DescribeStreamRequest {
  // Required.
  StreamRef ref = 1;
}
