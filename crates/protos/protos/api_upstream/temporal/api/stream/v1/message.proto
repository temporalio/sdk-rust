syntax = "proto3";

package temporal.api.stream.v1;

option go_package = "go.temporal.io/api/stream/v1;stream";
option java_package = "io.temporal.api.stream.v1";
option java_multiple_files = true;
option java_outer_classname = "MessageProto";
option ruby_package = "Temporalio::Api::Stream::V1";
option csharp_namespace = "Temporalio.Api.Stream.V1";

import "google/protobuf/timestamp.proto";

import "temporal/api/common/v1/message.proto";
import "temporal/api/enums/v1/stream.proto";

// Experimental. Might change in the future.
// Identifies one Stream. The id is opaque to callers.
message StreamRef {
    string id = 1;
    // The name of the backend that holds the Stream, as the Worker and client config register
    // it, so every process routes a ref it receives. Empty is the default backend. The Store
    // never reads it.
    string backend = 3;
}

// Experimental. Might change in the future.
// One Workflow Task attempt of a run. It orders by started_event_id, then attempt, then
// started_time.
message WorkflowTaskEpoch {
    int64 started_event_id = 1;
    int32 attempt = 2;
    // Tells a reused started event id apart, for example after a dropped speculative task.
    google.protobuf.Timestamp started_time = 3;
}

// Experimental. Might change in the future.
// The attempt of a Local Activity. It orders by task, then attempt, so a Local Activity of a
// later Workflow Task supersedes one of an earlier task.
message LocalActivityEpoch {
    // The Workflow Task attempt that dispatched the Local Activity.
    WorkflowTaskEpoch task = 1;
    // The Local Activity's own attempt in that Workflow Task.
    int32 attempt = 2;
}

// Experimental. Might change in the future.
// The attempt of an Activity. It orders by attempt_scheduled_time, then attempt.
message ActivityEpoch {
    // When the server scheduled this attempt. An Activity reset starts the attempt count again,
    // so only this time orders the attempts across a reset.
    google.protobuf.Timestamp attempt_scheduled_time = 1;
    int32 attempt = 2;
}

// Experimental. Might change in the future.
// The attempt of a client Producer, which the client picks.
message ClientEpoch {
    int32 attempt = 1;
}

// Experimental. Might change in the future.
// A Workflow run Producer. It writes in its Workflow Task. A higher epoch supersedes the Records of
// the run's Workflow Tasks that never completed, with those of their Local Activities.
message WorkflowProducer {
    // The first execution run id of the run chain.
    string run_id = 1;
    WorkflowTaskEpoch epoch = 2;
}

// Experimental. Might change in the future.
// A Local Activity Producer. A higher epoch supersedes the Producer's lower epochs.
message LocalActivityProducer {
    string run_id = 1;
    LocalActivityEpoch epoch = 2;
}

// Experimental. Might change in the future.
// An Activity Producer, for an Activity of a Workflow or a Standalone Activity. A higher epoch
// supersedes the Producer's lower epochs.
message ActivityProducer {
    string run_id = 1;
    ActivityEpoch epoch = 2;
}

// Experimental. Might change in the future.
// A client Producer. A higher epoch only fences the lower ones, since a restarted client's earlier
// Records are real messages, not the Records of a failed attempt. A client has no run.
message ClientProducer {
    ClientEpoch epoch = 1;
}

// Experimental. Might change in the future.
// The code that wrote a batch. Its id stays the same across attempts, and the kind's case orders
// its epochs and picks which earlier Records a higher epoch supersedes. A run-based kind carries its
// run, so a client can't.
message Producer {
    // Stable across attempts, such as `wf:<run id>` for the Workflow Producer of a run.
    string id = 1;
    // Required. The case is the kind of the Producer.
    oneof kind {
        WorkflowProducer workflow = 2;
        LocalActivityProducer local_activity = 3;
        ActivityProducer activity = 4;
        ActivityProducer standalone_activity = 5;
        ClientProducer client = 6;
    }
}

// Experimental. Might change in the future.
// The Producer of a write. An append and a close carry the same writer, so the Store orders each
// write the same way.
message StreamWriter {
    // Required on a write.
    Producer producer = 1;
}

// Experimental. Might change in the future.
// One Record of a batch to append. The Store adds the batch's Producer and an offset.
message AppendRecord {
    temporal.api.common.v1.Payload body = 1;
}

// Experimental. Might change in the future.
// One Record that a Producer appended.
message StreamData {
    Producer producer = 1;
    temporal.api.common.v1.Payload body = 2;
}

// Experimental. Might change in the future.
// The close of a Stream. A Stream has at most one, and a read returns it last.
message StreamClose {
    // The Producer that closed the Stream.
    Producer producer = 1;
    reserved 2, 3;
    reserved "result", "failure";
    // Why the Stream closed.
    temporal.api.enums.v1.StreamCloseStatus status = 4;
}

// Experimental. Might change in the future.
// An offset is ordered and unique in one Stream, and it is sparse. Offsets have gaps, so they
// don't count Records. Zero is never an offset. A read gives its Stream, so the read checks the
// offset against that Stream.
message StreamRecord {
    int64 offset = 1;
    // A read item is a Record or the close.
    oneof item {
        StreamData data = 2;
        StreamClose close = 4;
    }
}

// Experimental. Might change in the future.
// The details of a failed Stream call, in the gRPC status details and in the details of the
// application failure of a Nexus operation.
message StreamErrorDetails {
    temporal.api.enums.v1.StreamErrorReason reason = 1;
}
