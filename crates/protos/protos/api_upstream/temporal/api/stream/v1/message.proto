syntax = "proto3";

package temporal.api.stream.v1;

option go_package = "go.temporal.io/api/stream/v1;stream";
option java_package = "io.temporal.api.stream.v1";
option java_multiple_files = true;
option java_outer_classname = "MessageProto";
option ruby_package = "Temporalio::Api::Stream::V1";
option csharp_namespace = "Temporalio.Api.Stream.V1";

import "google/protobuf/timestamp.proto";

import "temporal/api/common/v1/message.proto";
import "temporal/api/enums/v1/stream.proto";

// Experimental. Might change in the future.
// Identifies one Stream. The id is opaque to callers. A Stream has no incarnations. A create of a
// closed or expired Stream fails, and it doesn't make a second Stream with the same id.
message StreamRef {
    string id = 1;
    // The name of the Store that holds the Stream, as the Worker and client config register it,
    // so every process routes a ref it receives. With no name, the SDK picks the Store from its
    // config. Only an SDK sets and reads it, since only the SDK knows the name that its config
    // gives a Store. A request carries the whole ref, and the server and a Store ignore this
    // field.
    string store = 3;
}

// Experimental. Might change in the future.
// One Workflow Task attempt of a run. It orders by started_event_id, then attempt, then
// started_time. The order holds among the attempts of one Producer only, and a Producer belongs
// to one run. So a reset run and the next run of a chain have other Producers, and their
// attempts have no order with these.
message WorkflowTaskAttempt {
    // Required.
    int64 started_event_id = 1;
    // Required. The attempt number of the task, 1 or more. Each task starts at 1 again, so the
    // number alone doesn't order the writes of a run.
    int32 attempt = 2;
    // Tells a reused started event id apart, for example after a dropped speculative task. Core
    // leaves it empty when the server gave the task no started time.
    google.protobuf.Timestamp started_time = 3;
}

// Experimental. Might change in the future.
// One attempt of a Local Activity. It orders by task, then attempt, so the same call in a later
// Workflow Task is a later attempt. The Producer carries the run. Records of two runs have no
// order by attempt, only their order in the Stream.
message LocalActivityAttempt {
    // Required. The Workflow Task attempt that dispatched the Local Activity.
    WorkflowTaskAttempt task = 1;
    // Required. The Local Activity's own attempt number in that Workflow Task, 1 or more.
    int32 attempt = 2;
}

// Experimental. Might change in the future.
// One attempt of an Activity. It orders by attempt_scheduled_time, then attempt.
message ActivityAttempt {
    // Required. When the server scheduled this attempt. An Activity reset starts the attempt
    // number at 1 again, so only this time orders the attempts across a reset.
    google.protobuf.Timestamp attempt_scheduled_time = 1;
    // Required. The attempt number, 1 or more.
    int32 attempt = 2;
}

// Experimental. Might change in the future.
// A Workflow run Producer. Workflow code that writes in its Workflow Task writes as this
// Producer, with the attempt of that task. A write that it makes through a Local Activity has a
// Local Activity Producer.
message WorkflowProducer {
    // Required. The run id of the Workflow run, not of its chain. Each run is its own Producer.
    string run_id = 1;
    // The Workflow Task attempt of the write. Workflow code leaves it empty, and the SDK sets it
    // before the write goes to the Store.
    WorkflowTaskAttempt attempt = 2;
}

// Experimental. Might change in the future.
// A Local Activity Producer, one for each call of a run.
message LocalActivityProducer {
    // Required. The run id of the Workflow run.
    string run_id = 1;
    // Required.
    LocalActivityAttempt attempt = 2;
}

// Experimental. Might change in the future.
// An Activity Producer, for an Activity of a Workflow or a Standalone Activity.
message ActivityProducer {
    // The run id of the Workflow run that scheduled the Activity. Empty for a Standalone
    // Activity, whose own run id is in the Producer id.
    string run_id = 1;
    // Required.
    ActivityAttempt attempt = 2;
}

// Experimental. Might change in the future.
// A client Producer. A client has no run and no attempt. So nothing fences a client's writes,
// and a reader never hides them.
message ClientProducer {
}

// Experimental. Might change in the future.
// The code that wrote a batch, which is one unit of work. Its id stays the same across attempts,
// and each write carries the attempt that made it. The kind's case orders its attempts. A Store
// can fence. Then, after a write of a later attempt, a write of an earlier attempt of the same
// Producer fails with FENCED. A Store that doesn't fence takes both writes. Each Record has its
// Producer and its attempt either way, so a reader may hide the Records of the earlier attempt.
// The rule is the same for every kind that has an attempt. A client has none. The attempts of
// two Producers never compare. A new run has new Producers, so no write fences or supersedes the
// Records of an earlier run, such as the base run of a reset.
message Producer {
    // Required. Stable across attempts, such as `wf:<run id>` for the Workflow Producer of a run.
    // It is unique in one Stream. The id of a run-based kind has its run id, so it stays unique
    // when Producers of more than one namespace write to one Stream.
    string id = 1;
    // Required. The case is the kind of the Producer.
    oneof kind {
        WorkflowProducer workflow = 2;
        LocalActivityProducer local_activity = 3;
        // An Activity that a Workflow scheduled.
        ActivityProducer workflow_activity = 4;
        // An Activity with no Workflow. Both Activity cases order their attempts the same way. The
        // case tells which identity the Producer has, since only the first has a Workflow run.
        ActivityProducer standalone_activity = 5;
        ClientProducer client = 6;
    }
}

// Experimental. Might change in the future.
// One Record of a batch to append. The Store adds the batch's Producer and an offset.
message AppendRecord {
    // Required.
    temporal.api.common.v1.Payload body = 1;
}

// Experimental. Might change in the future.
// One Record that a Producer appended, as a read gives it. A read gives only Records. A close
// stores no Record, so a read tells of it with the done flag of its response.
message StreamRecord {
    Producer producer = 1;
    temporal.api.common.v1.Payload body = 2;
    // Required. The Record's offset. An offset is ordered and unique in one Stream, and it is
    // sparse. Offsets have gaps, so they don't count Records. Two offsets of one Stream compare
    // bytewise, as unsigned bytes, in the order of their Records. So a reader, a Store and the
    // server order them without decoding them. An offset is never empty. A read gives its
    // Stream, so the read checks the offset against that Stream.
    bytes offset = 3;
}

// Experimental. Might change in the future.
// The details of a failed Stream call, in the gRPC status details and in the details of the
// application failure of a Nexus operation.
message StreamErrorDetails {
    temporal.api.enums.v1.StreamErrorReason reason = 1;
}
