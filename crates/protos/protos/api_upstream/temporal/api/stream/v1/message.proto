syntax = "proto3";

package temporal.api.stream.v1;

option go_package = "go.temporal.io/api/stream/v1;stream";
option java_package = "io.temporal.api.stream.v1";
option java_multiple_files = true;
option java_outer_classname = "MessageProto";
option ruby_package = "Temporalio::Api::Stream::V1";
option csharp_namespace = "Temporalio.Api.Stream.V1";

import "google/protobuf/timestamp.proto";

import "temporal/api/common/v1/message.proto";
import "temporal/api/enums/v1/stream.proto";

// Experimental. Might change in the future.
// Identifies one Stream. The id is opaque to callers.
message StreamRef {
    string id = 1;
    // The name of the backend that holds the Stream, as the Worker and client config register
    // it, so every process routes a ref it receives. With no name, the SDK picks the backend from
    // its config. Only an SDK reads it. A request carries the whole ref, and the server and a
    // Store ignore this field.
    string backend = 3;
}

// Experimental. Might change in the future.
// One Workflow Task attempt of a run. It orders by started_event_id, then attempt, then
// started_time. An epoch orders the attempts of one Producer only, and a Producer belongs to one
// run. So a reset run and the next run of a chain have other Producers, and their epochs start
// again.
message WorkflowTaskEpoch {
    // Required.
    int64 started_event_id = 1;
    // Required. 1 or more.
    int32 attempt = 2;
    // Tells a reused started event id apart, for example after a dropped speculative task. Core
    // leaves it empty when the server gave the task no started time.
    google.protobuf.Timestamp started_time = 3;
}

// Experimental. Might change in the future.
// The attempt of a Local Activity. It orders by task, then attempt, so the same call in a later
// Workflow Task is a higher epoch. The Producer carries the run. Records of two runs have no
// order by epoch, only their order in the Stream.
message LocalActivityEpoch {
    // Required. The Workflow Task attempt that dispatched the Local Activity.
    WorkflowTaskEpoch task = 1;
    // Required. The Local Activity's own attempt in that Workflow Task, 1 or more.
    int32 attempt = 2;
}

// Experimental. Might change in the future.
// The attempt of an Activity. It orders by attempt_scheduled_time, then attempt.
message ActivityEpoch {
    // Required. When the server scheduled this attempt. An Activity reset starts the attempt count
    // again, so only this time orders the attempts across a reset.
    google.protobuf.Timestamp attempt_scheduled_time = 1;
    // Required. 1 or more.
    int32 attempt = 2;
}

// Experimental. Might change in the future.
// The attempt of a client Producer, which the client picks. A client that runs the same work
// again under one Producer name stores this number and raises it at each start. A client with no
// name of its own is a new Producer in each process, so nothing fences or supersedes it.
message ClientEpoch {
    // Required. 1 or more.
    int32 attempt = 1;
}

// Experimental. Might change in the future.
// A Workflow run Producer. It writes in its Workflow Task.
message WorkflowProducer {
    // Required. The run id of the Workflow run, not of its chain. Each run is its own Producer.
    string run_id = 1;
    // A Workflow Producer only closes a Stream, and its close sends no epoch.
    WorkflowTaskEpoch epoch = 2;
}

// Experimental. Might change in the future.
// A Local Activity Producer, one for each call of a run.
message LocalActivityProducer {
    // Required. The run id of the Workflow run.
    string run_id = 1;
    // Required.
    LocalActivityEpoch epoch = 2;
}

// Experimental. Might change in the future.
// An Activity Producer, for an Activity of a Workflow or a Standalone Activity.
message ActivityProducer {
    // The run id of the Workflow run that scheduled the Activity. Empty for a Standalone
    // Activity, whose own run id is in the Producer id.
    string run_id = 1;
    // Required.
    ActivityEpoch epoch = 2;
}

// Experimental. Might change in the future.
// A client Producer. A client has no run.
message ClientProducer {
    // Required.
    ClientEpoch epoch = 1;
}

// Experimental. Might change in the future.
// The code that wrote a batch, which is one unit of work. Its id stays the same across attempts,
// and an epoch is one attempt. The kind's case orders its epochs. After a write of a higher epoch,
// a write of a lower epoch of the same Producer fails with FENCED, and a reader may hide the
// Records of the lower epoch. The rule is the same for every kind. The epochs of two Producers
// never compare. A run-based kind carries its run, so a client can't.
message Producer {
    // Required. Stable across attempts, such as `wf:<run id>` for the Workflow Producer of a run.
    // It is unique in one Stream, so it carries no namespace.
    string id = 1;
    // Required. The case is the kind of the Producer.
    oneof kind {
        WorkflowProducer workflow = 2;
        LocalActivityProducer local_activity = 3;
        // An Activity that a Workflow scheduled.
        ActivityProducer workflow_activity = 4;
        // An Activity with no Workflow. Both Activity cases order their epochs the same way. The
        // case tells which identity the Producer has, since only the first has a Workflow run.
        ActivityProducer standalone_activity = 5;
        ClientProducer client = 6;
    }
}

// Experimental. Might change in the future.
// One Record of a batch to append. The Store adds the batch's Producer and an offset.
message AppendRecord {
    // Required.
    temporal.api.common.v1.Payload body = 1;
}

// Experimental. Might change in the future.
// One Record that a Producer appended.
message StreamData {
    Producer producer = 1;
    temporal.api.common.v1.Payload body = 2;
    // Required. The Record's offset. An offset is ordered and unique in one Stream, and it is
    // sparse. Offsets have gaps, so they don't count Records. An offset is never empty. A read
    // gives its Stream, so the read checks the offset against that Stream.
    bytes offset = 3;
}

// Experimental. Might change in the future.
// The close of a Stream, as a read item. A close is its own call and stores no Record. A read
// builds this item from the close state of the Stream and returns it last, so a reader learns in
// order that the Stream ended, who closed it and why.
message StreamClose {
    // The Producer that closed the Stream.
    Producer producer = 1;
    // Why the Stream closed.
    temporal.api.enums.v1.StreamCloseStatus status = 2;
    // Required. Where the Stream ended.
    bytes offset = 3;
}

// Experimental. Might change in the future.
// One item that a read gives. Each item carries its own offset.
message StreamRecord {
    // A read item is a Record or the close. A newer server may send a kind that an older SDK
    // doesn't know.
    oneof item {
        StreamData data = 1;
        StreamClose close = 2;
    }
}

// Experimental. Might change in the future.
// The details of a failed Stream call, in the gRPC status details and in the details of the
// application failure of a Nexus operation.
message StreamErrorDetails {
    temporal.api.enums.v1.StreamErrorReason reason = 1;
}
