syntax = "proto3";

package temporal.api.export.v1;

option go_package = "go.temporal.io/api/export/v1;export";
option java_package = "io.temporal.api.export.v1";
option java_multiple_files = true;
option java_outer_classname = "MessageProto";
option ruby_package = "Temporalio::Api::Export::V1";
option csharp_namespace = "Temporalio.Api.Export.V1";

import "temporal/api/history/v1/message.proto";
import "temporal/api/workflowservice/v1/request_response.proto";

message WorkflowExecution {
    temporal.api.history.v1.History history = 1;
}

// WorkflowExecutions is the legacy Cloud Export file format containing only workflow executions.
// New exporters should use ExportedExecutions.
message WorkflowExecutions {
    repeated WorkflowExecution items = 1;
}

message ActivityExecution {
    temporal.api.workflowservice.v1.DescribeActivityExecutionResponse activity = 1;
}

// ExportedExecutions is used by the Cloud Export feature to deserialize the exported file.
// It encapsulates workflow execution information and contains other execution types.
message ExportedExecutions {
    repeated WorkflowExecution workflows = 1;
    repeated ActivityExecution activities = 2;
}

