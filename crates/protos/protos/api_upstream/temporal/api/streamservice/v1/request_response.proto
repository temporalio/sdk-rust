syntax = "proto3";

package temporal.api.streamservice.v1;

option go_package = "go.temporal.io/api/streamservice/v1;streamservice";
option java_package = "io.temporal.api.streamservice.v1";
option java_multiple_files = true;
option java_outer_classname = "RequestResponseProto";
option ruby_package = "Temporalio::Api::StreamService::V1";
option csharp_namespace = "Temporalio.Api.StreamService.V1";

// The messages of the Stream service. An SDK Store (Redis or memory) and the server answer the
// same four operations with them. A field that is only read by the server says so. A request has
// only the id of its Stream, and an SDK builds it from the request of the same name in
// `temporal.api.sdk.v1`, which has a `StreamRef`.
//
// The request id of a call is in its envelope, as for every Nexus operation. An SDK that calls a
// Store with no envelope passes the request id next to the request.

import "google/protobuf/duration.proto";

import "temporal/api/enums/v1/stream.proto";
import "temporal/api/stream/v1/message.proto";

// Experimental. Might change in the future.
// Creates a Stream. If the Stream already exists, the result depends on `id_conflict_policy`.
// `FAIL` fails with `ALREADY_EXISTS`, and `USE_EXISTING` succeeds with `created` false. A retry of
// the create that made the Stream, with the same request id, returns `created` true. The Store
// remembers the request id of that create, so a retry after a lost response doesn't fail with
// `ALREADY_EXISTS`. Either policy fails with `EXPIRED` for an expired Stream.
//
// A create has no Retention. Retention is a setting of the Store, as it's a setting of the
// namespace for Workflows. It's the only lifetime setting of a Stream. It starts at the create,
// and each append starts it again. When it passes, the Stream is expired.
// (-- api-linter: core::0133=disabled
//     aip.dev/not-precedent: The request identifies a Stream by its id. --)
message CreateStreamRequest {
    // Required. The id of the Stream to create. It must not be empty.
    string stream_id = 1;
    // What the create does if the Stream already exists. Unspecified means `FAIL`.
    temporal.api.enums.v1.StreamIdConflictPolicy id_conflict_policy = 2;
}

// Experimental. Might change in the future.
// The result of a create.
message CreateStreamResponse {
    // False when `USE_EXISTING` found a Stream that already existed.
    bool created = 1;
}

// Experimental. Might change in the future.
// Appends one batch of Records as one Producer. If the same batch arrives again, with the same
// Producer, attempt and request id, the Store writes it only once while it remembers the id, and it
// returns the offsets of the first write. A caller that got no response sends the batch again with
// the same request id. A Store remembers the request ids of the most recent batches of each
// Producer of the Stream. How many it remembers is a setting of the Store, so a try that arrives
// after more batches than that is written again. When the request id is empty, a retry is written
// again.
message AppendRecordsRequest {
    // Required.
    string stream_id = 1;
    // Required. The Producer that writes the batch.
    temporal.api.stream.v1.Producer producer = 2;
    // Required. A batch has at least one Record.
    repeated temporal.api.stream.v1.AppendRecord records = 3;
}

// Experimental. Might change in the future.
// The offsets of the first and the last Record of the batch.
message AppendRecordsResponse {
    bytes first_offset = 1;
    bytes last_offset = 2;
}

// Experimental. Might change in the future.
// Reads one page of Records after an offset. When no Record is left, the read waits for a new
// one, so a reader long-polls.
message ReadRecordsRequest {
    // Required.
    string stream_id = 1;
    // The read returns the Records after this offset. Empty means from the beginning. An offset
    // past the newest one fails with `OFFSET_TOO_HIGH`. To read only new Records, a caller gets
    // `last_offset` from a describe and reads after it.
    // (-- api-linter: core::0140::prepositions=disabled
    //     aip.dev/not-precedent: "from" marks the start of a range of offsets. --)
    bytes from_offset = 2;
    // The maximum number of Records in one page. Zero means no limit.
    int32 max_records = 3;
    // The maximum total size of the Records in one page, in bytes. A caller sets it so that a
    // page fits a limit of its own, such as the size of a History marker. A Record larger than
    // this is still returned, alone in its page, so a read always makes progress. Zero means no
    // limit.
    int64 max_bytes = 4;
    // How long the read waits for a new Record before it returns an empty page. When it's unset,
    // the read returns immediately.
    google.protobuf.Duration wait = 5;
}

// Experimental. Might change in the future.
// One page of a read.
message ReadRecordsResponse {
    repeated temporal.api.stream.v1.StreamRecord records = 1;
    // The last position that the read covered. The next read passes it as `from_offset`. A Store
    // doesn't have to set it. If it's empty, that position is the offset of the last Record in
    // this page, or the `from_offset` of the request for an empty page. A Store can set a later
    // offset that skips only entries of its own that aren't Records, so the next read doesn't
    // scan them again.
    bytes last_offset = 2;
}

// Experimental. Might change in the future.
// Gets the newest offset of a Stream.
message DescribeStreamRequest {
    // Required.
    string stream_id = 1;
}

// Experimental. Might change in the future.
// The state of a Stream. It doesn't include Retention, which is a setting of the Store and not
// of one Stream.
message DescribeStreamResponse {
    // The offset of the newest Record, or an offset after it that skips no Record. A read from it
    // returns only the Records that come later. It's empty when the Stream has no Record.
    bytes last_offset = 1;
}
