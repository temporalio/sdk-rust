[package]
name = "temporalio-protos"
version = "0.9.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Temporal Technologies Inc. <sdk@temporal.io>"]
license-file = { workspace = true }
description = "Compiled protobuf definitions for the Temporal Rust SDK"
homepage = "https://temporal.io/"
repository = "https://github.com/temporalio/sdk-rust"
keywords = ["temporal", "protobuf"]
categories = ["development-tools"]
exclude = ["protos/*/.github/*"]
links = "temporalio_protos"

[features]
default = []
serde_serialize = []
grpc-clients = ["tonic/channel"]
vendored-protox = ["dep:protox", "prost-types/vendored-protox"]

[dependencies]
anyhow = "1.0"
base64 = "0.23"
derive_more = { workspace = true }
http = "1"
prost = { workspace = true }
prost-types = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tonic = { workspace = true, default-features = false, features = ["codegen"] }
tonic-prost = { workspace = true }
pbjson = { workspace = true }

[build-dependencies]
prost = { workspace = true }
tonic-prost-build = { workspace = true }
pbjson-build = { workspace = true }
protox = { version = "0.9.1", optional = true }

[lints]
workspace = true
