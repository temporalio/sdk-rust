[package]
name = "temporalio-client"
version = "1.1.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Temporal Technologies Inc. <sdk@temporal.io>"]
license-file = { workspace = true }
description = "Clients for interacting with Temporal"
homepage = "https://temporal.io/"
repository = "https://github.com/temporalio/sdk-rust"
keywords = ["temporal", "workflow"]
categories = ["development-tools"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["experimental"]

[features]
experimental = []
vendored-protox = ["temporalio-common/vendored-protox"]
default = ["envconfig", "native-transport", "tls-ring"]
native-transport = [
  "callback-transport",
  "dep:hyper-util",
  "dep:tokio-rustls",
  "temporalio-common/grpc-transport",
  "tokio/net",
  "tonic/channel",
  "tonic/tls-native-roots",
]
callback-transport = ["temporalio-common/grpc-clients"]
tls-ring = ["native-transport", "tonic/tls-ring"]
tls-aws-lc = ["native-transport", "tonic/tls-aws-lc"]
telemetry = ["dep:opentelemetry"]
core-based-sdk = []
envconfig = ["temporalio-common/envconfig"]
dynamic-tls = ["native-transport", "dep:rustls-native-certs"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
backon = { version = "1.6", default-features = false }
base64 = "0.23"
bon = { version = "3", default-features = false, features = ["alloc"] }
derive_more = { workspace = true }
dyn-clone = "1.0"
bytes = "1.10"
futures-util = { version = "0.3", default-features = false }
futures-retry = "0.6.0"
http = "1.3"
http-body-util = "0.1"
hyper = { version = "1.7.0" }
hyper-util = { version = "0.1.16", optional = true }
opentelemetry = { workspace = true, features = ["metrics"], optional = true }
parking_lot = "0.12"
thiserror = { workspace = true }
tokio = { version = "1.47", default-features = false, features = [
  "io-util",
  "rt",
  "sync",
  "time",
] }
tonic = { workspace = true, default-features = false, features = ["gzip"] }
tokio-rustls = { version = "0.26", default-features = false, optional = true }
rustls-native-certs = { version = "0.8", optional = true }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
url = "2.5"
uuid = { version = "1.18", default-features = false, features = ["v4"] }
rand = "0.10"
serde_json = { workspace = true }

[dependencies.temporalio-common]
path = "../common"
version = "~1.1.0"
default-features = false
features = ["serde_serialize"]

[dev-dependencies]
assert_matches = "1"
hyper = { version = "1.7.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.16", features = ["http1", "server", "tokio"] }
mockall = "0.14"
prost = "0.14"
prost-types = { workspace = true }
rstest = "0.26"
tempfile = "3"
temporalio-macros = { path = "../macros", version = "~1.1.0" }
temporalio-workflow = { path = "../workflow", version = "~1.1.0" }
tokio = { version = "1.47", default-features = false, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }
tokio-stream = { version = "0.1", default-features = false, features = ["net"] }
tonic = { workspace = true, default-features = false, features = ["router", "server"] }
trybuild = { version = "1.0", features = ["diff"] }

[lints]
workspace = true
