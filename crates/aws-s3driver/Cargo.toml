[package]
name = "temporalio-aws-s3driver"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Temporal Technologies Inc. <sdk@temporal.io>"]
license-file = { workspace = true }
description = "Amazon S3 external storage driver for the Temporal Rust SDK"
homepage = "https://temporal.io/"
repository = "https://github.com/temporalio/sdk-rust"
keywords = ["temporal", "workflow", "s3"]
categories = ["development-tools"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["aws-sdk"]
aws-sdk = ["dep:aws-sdk-s3"]

[dependencies]
# The application configures the S3 client, including its TLS stack and async runtime.
aws-sdk-s3 = { version = "1", default-features = false, optional = true }
bon = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = [
  "alloc",
] }
prost = { workspace = true }
sha2 = "0.11"
thiserror = { workspace = true }

[dependencies.temporalio-common]
path = "../common"
version = "~1.2.0"
default-features = false
features = ["experimental"]

[dev-dependencies]
aws-config = { version = "1", features = ["behavior-version-latest"] }
# The examples need an HTTP client to reach S3, unlike the tests, which replay canned responses.
aws-sdk-s3 = { version = "1", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }
aws-smithy-http-client = { version = "1", features = ["test-util"] }
aws-smithy-types = "1"
flate2 = "1"
futures = "0.3"
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.47", features = [
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies.temporalio-client]
path = "../client"

[dev-dependencies.temporalio-macros]
path = "../macros"

[dev-dependencies.temporalio-sdk]
path = "../sdk"
features = ["experimental"]

[dev-dependencies.temporalio-workflow]
path = "../workflow"

[[example]]
name = "external-storage-worker"
path = "examples/external_storage/worker.rs"

[[example]]
name = "external-storage-starter"
path = "examples/external_storage/starter.rs"

[[example]]
name = "external-storage-s3-mock"
path = "examples/external_storage/s3_mock.rs"

[lints]
workspace = true
