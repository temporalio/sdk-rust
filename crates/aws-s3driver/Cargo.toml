[package]
name = "temporalio-aws-s3driver"
version = "1.1.0"
edition = "2024"
rust-version = "1.92.0"
authors = ["Temporal Technologies Inc. <sdk@temporal.io>"]
license-file = { workspace = true }
description = "Amazon S3 external storage driver for the Temporal Rust SDK"
homepage = "https://temporal.io/"
repository = "https://github.com/temporalio/sdk-rust"
keywords = ["temporal", "workflow", "s3"]
categories = ["development-tools"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["aws-sdk"]
aws-sdk = ["dep:aws-sdk-s3"]

[dependencies]
# The application configures the S3 client, including its TLS stack and async runtime.
aws-sdk-s3 = { version = "1", default-features = false, optional = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
prost = { workspace = true }
sha2 = "0.11"
thiserror = { workspace = true }

[dependencies.temporalio-common]
path = "../common"
version = "~1.1.0"
default-features = false
features = ["experimental"]

[dev-dependencies]
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1", features = ["test-util"] }
aws-smithy-types = "1"
http = "1"
tokio = { version = "1.47", features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
