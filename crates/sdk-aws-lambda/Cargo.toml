[package]
name = "temporalio-sdk-aws-lambda"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
authors = ["Temporal Technologies Inc. <sdk@temporal.io>"]
license-file = { workspace = true }
description = "AWS Lambda integration for the Temporal Rust SDK"
homepage = "https://temporal.io/"
repository = "https://github.com/temporalio/sdk-rust"
keywords = ["temporal", "workflow", "aws", "lambda", "serverless"]
categories = ["development-tools"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["tls-ring"]
tls-ring = [
  "temporalio-client/tls-ring",
  "temporalio-common/tls-ring",
  "opentelemetry-otlp?/tls-ring",
  "tonic?/tls-ring",
]
tls-aws-lc = [
  "temporalio-client/tls-aws-lc",
  "temporalio-common/tls-aws-lc",
  "opentelemetry-otlp?/tls-aws-lc",
  "tonic?/tls-aws-lc",
]
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry_sdk",
  "dep:tonic",
  "temporalio-common/otel",
  "temporalio-sdk/otel",
  "temporalio-sdk/opentelemetry",
]

[dependencies]
anyhow = "1.0"
bon = { workspace = true }
lambda_runtime = "1.3"
opentelemetry = { workspace = true, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
  "grpc-tonic", "tls-roots", "tokio", "trace",
], optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = [
  "rt-tokio", "trace",
], optional = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.47", default-features = false, features = ["rt", "sync", "time", "macros"] }
tonic = { workspace = true, features = ["tls-native-roots"], optional = true }
tracing = "0.1"

[dependencies.temporalio-client]
path = "../client"
version = "~1.3.0"
default-features = false
features = ["envconfig"]

[dependencies.temporalio-common]
path = "../common"
version = "~1.3.0"
default-features = false

[dependencies.temporalio-sdk]
path = "../sdk"
version = "~1.3.0"
default-features = false
features = ["envconfig", "experimental"]

[dev-dependencies]
futures = "0.3"
http = "1"
tempfile = "3"
temporalio-macros = { path = "../macros", version = "~1.3.0" }
temporalio-workflow = { path = "../workflow", version = "~1.3.0" }
tokio = { version = "1.47", default-features = false, features = [
  "macros", "rt", "rt-multi-thread", "sync", "test-util", "time",
] }

[[example]]
name = "aws-lambda-worker"
required-features = ["otel"]

[[example]]
name = "aws-lambda-starter"
required-features = ["otel"]

[lints]
workspace = true
